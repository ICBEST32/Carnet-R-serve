<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet de Réserve</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet Réserve">
<style>
:root{--paper:#ede6d6;--olive:#3e4636;--khaki:#a9a17e;--ink:#1f2a24;--rust:#a63a2e;--gold:#c9a227;--blue:#2b4c7e;--blue-light:rgba(43,76,126,.28)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--olive);font-family:Courier New,monospace;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:28px 14px 60px}.carnet,.install-banner{width:100%;max-width:800px}.carnet{background:var(--paper);border:1px solid #555;box-shadow:0 18px 40px #0005;position:relative;padding-bottom:28px}.carnet:before{content:"";display:block;height:10px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,var(--olive) 14px 28px)}
header{padding:24px 32px 20px;border-bottom:2px solid var(--ink)}h1{font-family:Impact,Arial Black,sans-serif;font-size:46px;letter-spacing:2px;margin:0;text-transform:uppercase}.sub{font-size:14px;color:#5b5646;margin-top:8px}section{padding:0 32px}.field-label{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#5b5646;margin:20px 0 7px;font-weight:bold}
.quota-box{border:1px solid var(--ink);background:#a9a17e26;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.quota-title{font-family:Impact,Arial Black,sans-serif;font-size:18px;letter-spacing:1px;display:flex;align-items:center;gap:8px}.year-nav,.cal-nav button{background:none;border:1px solid var(--ink);color:var(--ink);font-size:22px;width:32px;height:32px;cursor:pointer}.year-nav:hover,.cal-nav button:hover{background:var(--khaki)}.quota-fields{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.quota-field{display:flex;flex-direction:column;align-items:center;gap:3px}.quota-field label{font-size:10px;text-transform:uppercase;color:#8b8465}.quota-field input{width:80px;text-align:center;font:bold 17px Courier New;padding:7px 4px;border:1px solid var(--ink);background:#fbf8f0}.static-num{font:bold 25px Impact,Arial Black,sans-serif;color:var(--olive)}.static-num.over{color:var(--rust)}
.picker-wrap{position:relative}.picker-trigger{width:100%;text-align:left;background:#fbf8f0;border:1px solid var(--ink);font:16px Courier New;padding:14px 16px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between}.picker-trigger .ph{color:#8b8465}.calendar-pop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--paper);border:1px solid var(--ink);box-shadow:0 12px 28px #0006;z-index:50;padding:16px;display:none}.calendar-pop.open{display:block}.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cal-month{font:bold 19px Impact,Arial Black,sans-serif;text-transform:uppercase}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal-dow{font-size:10px;text-align:center;color:#8b8465;padding-bottom:5px}.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font:13px Courier New;cursor:pointer;background:transparent;border:1px solid transparent;color:var(--ink)}button.cal-day{width:100%}.cal-day.muted{color:#c7c0aa;cursor:default}.cal-day.today{border-color:var(--olive)}.cal-day:hover:not(.muted){background:var(--khaki)}.cal-day.in-range{background:var(--blue-light)}.cal-day.range-start,.cal-day.range-end{background:var(--blue);color:var(--paper);font-weight:bold}.cal-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.cal-selection{font-size:12px;color:#5b5646}.weekend-toggle{font-size:12px;color:#5b5646}.btn-confirm{background:var(--olive);color:var(--paper);border:1px solid var(--ink);font:bold 14px Impact,Arial Black,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:10px 18px;cursor:pointer;width:100%;margin-top:12px}.btn-confirm:disabled{opacity:.4;cursor:not-allowed}
.month-group{margin-top:26px}.month-title{font:bold 17px Impact,Arial Black,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--olive);display:flex;gap:10px;margin-bottom:6px}.month-title:after{content:"";flex:1;border-top:2px double var(--ink)}.period-list{list-style:none;margin:0;padding:0}.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px dotted #8b8465;font-size:14px}.range{font-weight:bold}.meta{font-size:11px;color:#8b8465;display:block;margin-top:3px}.right{display:flex;align-items:center;gap:10px;flex-shrink:0}.amount{color:var(--olive);font-weight:bold}.paid .range,.paid .amount{color:#8b8465}.pay-btn,.del,.backup-btn,.print-btn,.reset{cursor:pointer;font-family:Courier New,monospace}.pay-btn{background:none;border:1px solid var(--khaki);color:#5b5646;font-size:10px;padding:5px 8px}.pay-btn.is-paid{border:2px solid var(--rust);color:var(--rust);background:#a63a2e0f;font-weight:bold}.del{background:none;color:var(--rust);font-weight:bold;font-size:15px;padding:2px 6px;border:1px solid transparent}.empty{text-align:center;color:#8b8465;padding:28px 2px}.totals{margin-top:28px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.count{font-size:13px;color:#5b5646;line-height:1.6}.count b{color:var(--ink);font-size:15px}.sub-line{font-size:12px;color:#8b8465}.stamp{width:128px;height:128px;border-radius:50%;border:4px double var(--rust);color:var(--rust);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-9deg);opacity:.88;text-align:center}.stamp .label{font:bold 12px Impact,Arial Black,sans-serif;letter-spacing:2px}.stamp .value{font:bold 22px Impact,Arial Black,sans-serif;margin:2px 0}.stamp .rate{font-size:10px}.backup-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 32px;margin-top:24px}.backup-btn{background:none;color:var(--olive);border:1px solid var(--olive);font:bold 12px Impact,Arial Black,sans-serif;letter-spacing:1px;padding:11px 10px}.backup-btn:disabled{opacity:.5}.install-banner{display:none;background:var(--paper);border:1px solid var(--ink);border-left:5px solid var(--gold);padding:14px 16px;margin-bottom:12px;font-size:13px;line-height:1.5}.install-banner.show{display:flex;justify-content:space-between;gap:12px}.close-banner{background:none;border:0;font-size:18px;cursor:pointer}footer{padding:18px 32px 0;display:flex;justify-content:space-between;align-items:center}.print-btn{background:var(--olive);color:var(--paper);border:1px solid var(--ink);font:bold 13px Impact,Arial Black,sans-serif;padding:10px 18px}.reset{background:none;color:#8b8465;font-size:11px;text-decoration:underline;border:0}.status{font-size:12px;color:#8b8465;padding:0 32px;margin-top:10px;min-height:18px}
@media(max-width:650px){body{padding:15px 8px 40px}.carnet{max-width:100%}header{padding:25px 20px 18px}h1{font-size:35px}section{padding:0 20px}.backup-row{padding:0 20px;grid-template-columns:1fr 1fr}footer{padding-left:20px;padding-right:20px}.status{padding-left:20px;padding-right:20px}.entry{align-items:flex-start}.right{flex-wrap:wrap;justify-content:flex-end}}
@media(max-width:420px){h1{font-size:30px}.quota-fields{width:100%;justify-content:space-between;gap:8px}.stamp{width:105px;height:105px}.entry{flex-wrap:wrap}.right{width:100%;justify-content:flex-end}.backup-row{grid-template-columns:1fr}}
@media print{.install-banner,.backup-row,footer,.status,.picker-wrap{display:none!important}body{background:#fff;padding:0}.carnet{box-shadow:none;border:0;max-width:100%}.pay-btn,.del{display:none!important}}
</style>

<script id="sync-state">
window.__RESERVE_SYNC_STATE__ = {
  "periods": [],
  "quotas": {"2026":30},
  "updated_at": "1970-01-01T00:00:00.000Z"
};
</script>
</head>
<body>
<div class="install-banner" id="installBanner"><span><strong>Ajoute-la à l'écran d'accueil</strong><br><span>Safari → Partager → « Sur l'écran d'accueil ».</span></span><button class="close-banner" id="closeBanner">✕</button></div>
<div class="carnet">
<header><h1>Carnet de réserve</h1><div class="sub">Enregistrement des périodes de réserve</div></header>
<section>
<div class="field-label">Quota annuel</div>
<div class="quota-box">
<div class="quota-title"><button type="button" class="year-nav" id="prevYear">‹</button>Réserve <span id="quotaYear">2026</span><button type="button" class="year-nav" id="nextYear">›</button></div>
<div class="quota-fields">
<div class="quota-field"><label>Accordés</label><input type="number" id="quotaInput" min="0" step="1" inputmode="numeric"></div>
<div class="quota-field"><label>Utilisés</label><span class="static-num" id="usedDaysVal">0</span></div>
<div class="quota-field"><label>Restants</label><span class="static-num" id="remainingDaysVal">0</span></div>
</div>
</div>
<div class="field-label">Nouvelle période</div>
<div class="picker-wrap">
<button type="button" class="picker-trigger" id="pickerTrigger"><span id="pickerLabel" class="ph">Choisir une période…</span><span>📅</span></button>
<div class="calendar-pop" id="calendarPop">
<div class="cal-nav"><button type="button" id="prevMonth">‹</button><span class="cal-month" id="calMonthLabel"></span><button type="button" id="nextMonth">›</button></div>
<div class="cal-grid" id="calGrid"></div>
<div class="cal-footer"><span class="cal-selection" id="calSelection">Sélectionne le premier jour</span><label class="weekend-toggle"><input type="checkbox" id="includeWeekends"> Inclure week-ends</label></div>
<button type="button" class="btn-confirm" id="confirmAdd" disabled>Ajouter la période</button>
</div>
</div>
<div id="monthGroups"></div>
<div class="totals"><div class="count" id="countText"></div><div class="stamp"><div class="label">Total payé</div><div class="value" id="totalValue">0 €</div><div class="rate">80 €/jour</div></div></div>
</section>
<div class="backup-row">
<button class="backup-btn" id="saveHtmlBtn" type="button">💾 Sauvegarder</button>
<button class="backup-btn" id="syncBtn" type="button">🔄 Synchroniser</button>
<button class="backup-btn" id="saveJsonBtn" type="button">📄 Exporter JSON</button>
<button class="backup-btn" id="loadJsonBtn" type="button">📥 Importer JSON</button>
<input type="file" id="jsonFileInput" accept="application/json,.json" hidden>
</div>
<footer><button class="print-btn" id="printBtn" type="button">🖨 Imprimer</button><button class="reset" id="resetBtn" type="button">Effacer tout le carnet</button></footer>
<div class="status" id="status"></div>
</div>

<script>
'use strict';

const RATE=80;
const STORAGE_KEY='reserve-backup-v3';
const GITHUB_FUNCTION_URL='https://iwmtlbqwzbbnyrzggjdz.supabase.co/functions/v1/save-to-github';
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DOW=['L','M','M','J','V','S','D'];

const $=id=>document.getElementById(id);
const els={
  monthGroups:$('monthGroups'),count:$('countText'),total:$('totalValue'),status:$('status'),
  picker:$('pickerTrigger'),pickerLabel:$('pickerLabel'),pop:$('calendarPop'),grid:$('calGrid'),
  month:$('calMonthLabel'),selection:$('calSelection'),prevMonth:$('prevMonth'),nextMonth:$('nextMonth'),
  weekends:$('includeWeekends'),confirm:$('confirmAdd'),year:$('quotaYear'),prevYear:$('prevYear'),
  nextYear:$('nextYear'),quota:$('quotaInput'),used:$('usedDaysVal'),remaining:$('remainingDaysVal'),
  save:$('saveHtmlBtn'),sync:$('syncBtn'),saveJson:$('saveJsonBtn'),loadJson:$('loadJsonBtn'),file:$('jsonFileInput'),
  print:$('printBtn'),reset:$('resetBtn')
};

let periods=[];
let quotas={};
let selectedYear=new Date().getFullYear();
let viewDate=new Date();
viewDate.setDate(1);
let selStart=null,selEnd=null;
let stateUpdatedAt='1970-01-01T00:00:00.000Z';
let busy=false;

function status(msg,error=false){els.status.textContent=msg||'';els.status.style.color=error?'#A63A2E':'#8b8465'}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dateOf(s){const d=new Date(s+'T00:00:00');return Number.isNaN(d.getTime())?null:d}
function validISO(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!!dateOf(s)}
function full(s){const d=dateOf(s);return d?`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`:'?'}
function short(s){const d=dateOf(s);return d?`${pad(d.getDate())}/${pad(d.getMonth()+1)}`:'?'}
function monthKey(s){const d=dateOf(s);return d?`${d.getFullYear()}-${pad(d.getMonth()+1)}`:''}
function id(){return crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function normalizePeriods(input){
  if(!Array.isArray(input))return [];
  return input.filter(p=>p&&validISO(p.start)&&validISO(p.end)&&Array.isArray(p.dates)).map(p=>{
    const dates=[...new Set(p.dates.filter(validISO))].sort();
    const start=p.start<=p.end?p.start:p.end;
    const end=p.start<=p.end?p.end:p.start;
    return {id:typeof p.id==='string'&&p.id?p.id:id(),start,end,dates,paid:p.paid===true};
  });
}
function normalizeQuotas(input){
  if(!input||typeof input!=='object'||Array.isArray(input))return {};
  const out={};
  Object.keys(input).forEach(y=>{if(/^\d{4}$/.test(y))out[y]=Math.max(0,Number.parseInt(input[y],10)||0)});
  return out;
}
function getEmbedded(){
  const s=window.__RESERVE_SYNC_STATE__;
  if(!s||typeof s!=='object')return null;
  return {periods:normalizePeriods(s.periods),quotas:normalizeQuotas(s.quotas),updated_at:typeof s.updated_at==='string'?s.updated_at:'1970-01-01T00:00:00.000Z'};
}
function saveLocal(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({periods:normalizePeriods(periods),quotas:normalizeQuotas(quotas),updated_at:stateUpdatedAt}))}catch(e){console.warn(e)}
}
function loadLocal(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(!x)return false;
    periods=normalizePeriods(x.periods);quotas=normalizeQuotas(x.quotas);
    stateUpdatedAt=typeof x.updated_at==='string'?x.updated_at:'1970-01-01T00:00:00.000Z';
    return true;
  }catch(e){console.warn(e);return false}
}
function markChanged(){
  stateUpdatedAt=new Date().toISOString();
  saveLocal();
}
function ensureQuota(y){
  if(!Object.prototype.hasOwnProperty.call(quotas,String(y)))quotas[String(y)]=30;
}
function usedForYear(y){
  return periods.reduce((n,p)=>n+p.dates.filter(s=>dateOf(s).getFullYear()===y).length,0);
}
function updateQuota(){
  ensureQuota(selectedYear);
  const granted=Number.parseInt(els.quota.value,10)||0;
  const used=usedForYear(selectedYear);
  const rem=granted-used;
  els.used.textContent=used;els.remaining.textContent=rem;els.remaining.classList.toggle('over',rem<0);
}
function changeYear(delta){
  selectedYear+=delta;ensureQuota(selectedYear);els.year.textContent=selectedYear;els.quota.value=quotas[String(selectedYear)];updateQuota()
}
els.prevYear.onclick=()=>changeYear(-1);
els.nextYear.onclick=()=>changeYear(1);
els.quota.oninput=()=>{ensureQuota(selectedYear);quotas[String(selectedYear)]=Math.max(0,Number.parseInt(els.quota.value,10)||0);markChanged();updateQuota()};

function renderCalendar(){
  els.month.textContent=`${MONTHS[viewDate.getMonth()]} ${viewDate.getFullYear()}`;
  els.grid.innerHTML='';
  DOW.forEach(x=>{const e=document.createElement('div');e.className='cal-dow';e.textContent=x;els.grid.appendChild(e)});
  const first=new Date(viewDate.getFullYear(),viewDate.getMonth(),1);
  const offset=(first.getDay()+6)%7;
  for(let i=0;i<offset;i++){const e=document.createElement('div');e.className='cal-day muted';els.grid.appendChild(e)}
  const days=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,0).getDate(),today=iso(new Date());
  for(let n=1;n<=days;n++){
    const d=new Date(viewDate.getFullYear(),viewDate.getMonth(),n),s=iso(d),e=document.createElement('button');
    e.type='button';e.className='cal-day';e.textContent=n;
    if(s===today)e.classList.add('today');
    if(s===selStart)e.classList.add('range-start');
    if(s===selEnd)e.classList.add('range-end');
    if(selStart&&selEnd&&s>selStart&&s<selEnd)e.classList.add('in-range');
    e.onclick=()=>selectDay(s);els.grid.appendChild(e);
  }
  updateSelection()
}
function selectDay(s){
  if(!selStart||selEnd){selStart=s;selEnd=null}
  else if(s<selStart){selEnd=selStart;selStart=s}
  else selEnd=s;
  renderCalendar()
}
function updateSelection(){
  if(selStart&&selEnd){els.selection.textContent=`Du ${full(selStart)} au ${full(selEnd)}`;els.confirm.disabled=false;els.pickerLabel.textContent=`${full(selStart)} → ${full(selEnd)}`;els.pickerLabel.classList.remove('ph')}
  else if(selStart){els.selection.textContent=`Début : ${full(selStart)} — choisis la fin`;els.confirm.disabled=true;els.pickerLabel.textContent=full(selStart);els.pickerLabel.classList.remove('ph')}
  else{els.selection.textContent='Sélectionne le premier jour';els.confirm.disabled=true;els.pickerLabel.textContent='Choisir une période…';els.pickerLabel.classList.add('ph')}
}
function openCal(){els.pop.classList.add('open');renderCalendar()}
function closeCal(){els.pop.classList.remove('open')}
els.picker.onclick=e=>{e.stopPropagation();els.pop.classList.toggle('open');if(els.pop.classList.contains('open'))renderCalendar()};
els.prevMonth.onclick=e=>{e.stopPropagation();viewDate.setMonth(viewDate.getMonth()-1);renderCalendar()};
els.nextMonth.onclick=e=>{e.stopPropagation();viewDate.setMonth(viewDate.getMonth()+1);renderCalendar()};
els.pop.onclick=e=>e.stopPropagation();
document.addEventListener('click',e=>{if(!e.target.closest('.picker-wrap'))closeCal()});

els.confirm.onclick=()=>{
  if(!selStart||!selEnd)return;
  const dates=[],d=dateOf(selStart),last=dateOf(selEnd),weekends=els.weekends.checked;
  for(let cur=new Date(d);cur<=last;cur.setDate(cur.getDate()+1)){
    const day=cur.getDay();
    if(weekends||(![0,6].includes(day)))dates.push(iso(cur))
  }
  if(!dates.length){status('Aucun jour ouvré dans cette période.',true);return}
  const used=new Set(periods.flatMap(p=>p.dates));
  if(dates.some(x=>used.has(x))){status('Cette période chevauche des jours déjà consignés.',true);return}
  periods.push({id:id(),start:selStart,end:selEnd,dates,paid:false});
  markChanged();selStart=selEnd=null;els.weekends.checked=false;closeCal();render();status('Période ajoutée. Pense à sauvegarder pour la synchroniser.')
};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){
  els.monthGroups.innerHTML='';
  const sorted=[...periods].sort((a,b)=>a.start.localeCompare(b.start));
  if(!sorted.length){els.monthGroups.innerHTML='<div class="empty">Aucune période consignée pour le moment.</div>'}
  else{
    const groups={};
    sorted.forEach(p=>(groups[monthKey(p.start)]??=[]).push(p));
    Object.keys(groups).sort().forEach(k=>{
      const [y,m]=k.split('-'),box=document.createElement('div');box.className='month-group';
      box.innerHTML=`<div class="month-title">${MONTHS[Number(m)-1]} ${y}</div>`;
      const ul=document.createElement('ul');ul.className='period-list';
      groups[k].forEach(p=>{
        const li=document.createElement('li');li.className='entry'+(p.paid?' paid':'');
        const label=p.start===p.end?full(p.start):`${short(p.start)} → ${full(p.end)}`;
        li.innerHTML=`<span><span class="range">${esc(label)}</span><span class="meta">${p.dates.length} jour${p.dates.length===1?'':'s'}</span></span><span class="right"><span class="amount">${p.dates.length*RATE} €</span><button class="pay-btn ${p.paid?'is-paid':''}" data-action="pay" data-id="${esc(p.id)}" type="button">${p.paid?'Payé ✓':'Marquer payé'}</button><button class="del" data-action="delete" data-id="${esc(p.id)}" type="button">✕</button></span>`;
        ul.appendChild(li)
      });box.appendChild(ul);els.monthGroups.appendChild(box)
    })
  }
  const totalDays=sorted.reduce((n,p)=>n+p.dates.length,0),paidDays=sorted.filter(p=>p.paid).reduce((n,p)=>n+p.dates.length,0),pending=totalDays-paidDays;
  els.count.innerHTML=`<b>${sorted.length}</b> période${sorted.length===1?'':'s'} — <b>${totalDays}</b> jour${totalDays===1?'':'s'}${pending?`<div class="sub-line">dont ${pending*RATE} € en attente de paiement (${pending} j.)</div>`:''}`;
  els.total.textContent=`${paidDays*RATE} €`;els.year.textContent=selectedYear;ensureQuota(selectedYear);els.quota.value=quotas[String(selectedYear)];updateQuota()
}
els.monthGroups.onclick=e=>{
  const b=e.target.closest('button[data-action]');if(!b)return;
  const p=periods.find(x=>x.id===b.dataset.id);if(!p)return;
  if(b.dataset.action==='pay'){p.paid=!p.paid;markChanged();render();status(p.paid?'Période marquée comme payée.':'Paiement annulé.')}
  if(b.dataset.action==='delete'){if(confirm('Supprimer cette période ?')){periods=periods.filter(x=>x.id!==p.id);markChanged();render();status('Période supprimée.')}}
};
els.print.onclick=()=>window.print();

function download(content,name,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
els.saveJson.onclick=()=>{download(JSON.stringify({periods:normalizePeriods(periods),quotas:normalizeQuotas(quotas),updated_at:new Date().toISOString()},null,2),'carnet-reserve-donnees.json','application/json');status('Fichier JSON exporté.')};
els.loadJson.onclick=()=>{els.file.value='';els.file.click()};
els.file.onchange=async e=>{
  const f=e.target.files?.[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.periods))throw Error('Format JSON invalide');
    const np=normalizePeriods(d.periods),nq=normalizeQuotas(d.quotas);
    if(!confirm(`Importer ce fichier remplacera ${periods.length} période(s) par ${np.length}. Continuer ?`))return;
    periods=np;quotas=nq;stateUpdatedAt=new Date().toISOString();saveLocal();render();status('✅ Import JSON réussi.')
  }catch(err){console.error(err);status('❌ Fichier JSON invalide.',true)}
};
els.reset.onclick=()=>{
  if(!confirm('Effacer toutes les périodes consignées ? Cette action est irréversible.'))return;
  periods=[];stateUpdatedAt=new Date().toISOString();saveLocal();render();status('Carnet effacé. Pense à sauvegarder pour synchroniser cet état.')
};

function buildSyncedHtml(){
  const doc=document.documentElement.cloneNode(true),script=doc.querySelector('#sync-state');
  if(!script)throw Error('Bloc de synchronisation introuvable');
  const state={periods:normalizePeriods(periods),quotas:normalizeQuotas(quotas),updated_at:stateUpdatedAt};
  const json=JSON.stringify(state,null,2).replace(/</g,'\\u003c');
  script.textContent=`window.__RESERVE_SYNC_STATE__ = ${json};`;
  return '<!DOCTYPE html>\\n'+doc.outerHTML;
}
async function requestWithTimeout(url,options={},ms=30000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{return await fetch(url,{...options,signal:c.signal,cache:'no-store'})}
  finally{clearTimeout(t)}
}
let saving=false;
els.save.onclick=async()=>{
  if(saving)return;saving=true;els.save.disabled=true;els.sync.disabled=true;els.save.textContent='⏳ Sauvegarde...';status('Envoi de la sauvegarde...');
  try{
    saveLocal();
    const response=await requestWithTimeout(GITHUB_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:buildSyncedHtml()})});
    const text=await response.text();let data=null;try{data=text?JSON.parse(text):null}catch{}
    if(!response.ok)throw Error(data?.error||data?.message||`Erreur HTTP ${response.status}`);
    if(data?.success!==true)throw Error(data?.error||data?.message||'Le serveur n’a pas confirmé la sauvegarde.');
    status('✅ Sauvegarde GitHub réussie. Tu peux synchroniser l’autre appareil.')
  }catch(err){console.error(err);status(`❌ Sauvegarde impossible : ${err.name==='AbortError'?'délai dépassé':err.message}`,true)}
  finally{saving=false;els.save.disabled=false;els.sync.disabled=false;els.save.textContent='💾 Sauvegarder'}
};

let syncing=false;
els.sync.onclick=async()=>{
  if(syncing)return;syncing=true;els.sync.disabled=true;els.save.disabled=true;els.sync.textContent='⏳ Synchronisation...';status('Lecture de la version publiée...');
  try{
    const u=new URL(location.href);u.searchParams.set('sync',Date.now());
    const response=await requestWithTimeout(u.toString(),{headers:{'Cache-Control':'no-cache'}});
    if(!response.ok)throw Error(`Impossible de récupérer la page (${response.status})`);
    const html=await response.text(),doc=new DOMParser().parseFromString(html,'text/html'),script=doc.querySelector('#sync-state');
    if(!script)throw Error('Aucune donnée synchronisée trouvée dans la page distante.');
    const text=script.textContent.trim(),m=text.match(/window\\.__RESERVE_SYNC_STATE__\\s*=\\s*(\\{[\\s\\S]*?\\})\\s*;?$/);
    if(!m)throw Error('Format de synchronisation invalide.');
    const remote=JSON.parse(m[1]),remotePeriods=normalizePeriods(remote.periods),remoteQuotas=normalizeQuotas(remote.quotas),remoteTime=Date.parse(remote.updated_at)||0,localTime=Date.parse(stateUpdatedAt)||0;
    if(remoteTime<localTime){status('⚠️ La version locale est plus récente. Sauvegarde-la avant de synchroniser.',true);return}
    periods=remotePeriods;quotas=remoteQuotas;stateUpdatedAt=remote.updated_at||new Date().toISOString();saveLocal();render();status(`✅ Synchronisation terminée : ${periods.length} période(s) récupérée(s).`)
  }catch(err){console.error(err);status(`❌ Synchronisation impossible : ${err.name==='AbortError'?'délai dépassé':err.message}`,true)}
  finally{syncing=false;els.sync.disabled=false;els.save.disabled=false;els.sync.textContent='🔄 Synchroniser'}
};

(function initBanner(){
  const b=$('installBanner'),c=$('closeBanner'),key='reserve-banner-v2';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=navigator.standalone===true||matchMedia('(display-mode:standalone)').matches;
  if(ios&&!standalone&&localStorage.getItem(key)!=='1')b.classList.add('show');
  c.onclick=()=>{b.classList.remove('show');try{localStorage.setItem(key,'1')}catch{}}
})();

function init(){
  const embedded=getEmbedded();
  if(embedded){
    periods=embedded.periods;quotas=embedded.quotas;stateUpdatedAt=embedded.updated_at;
    // L'état intégré est la source de vérité. Le local ne l'écrase jamais.
  }else{
    loadLocal();
  }
  ensureQuota(selectedYear);els.year.textContent=selectedYear;els.quota.value=quotas[String(selectedYear)];render();renderCalendar();status('Carnet prêt.')
}
init();
</script>
